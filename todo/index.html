<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mera Todo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .box { width: 100%; max-width: 420px; }
    h1 { color: #38bdf8; text-align: center; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; }
    button { padding: 12px 16px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 16px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px; border-radius: 8px; margin-top: 10px; }
    li span { cursor: pointer; flex: 1; }
    li.done span { text-decoration: line-through; color: #64748b; }
    .del { background: #ef4444; color: #fff; padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📝 Mera Todo</h1>
    <form id="f">
      <input id="t" placeholder="Kaam likho..." required>
      <button>Add</button>
    </form>
    <ul id="list"></ul>
  </div>
  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    function save() { localStorage.setItem('todos', JSON.stringify(todos)); render(); }
    function render() {
      const ul = document.getElementById('list');
      ul.innerHTML = '';
      todos.forEach((x, i) => {
        const li = document.createElement('li');
        if (x.done) li.className = 'done';
        const span = document.createElement('span');
        span.textContent = x.text;
        span.onclick = () => { todos[i].done = !todos[i].done; save(); };
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'X';
        del.onclick = () => { todos.splice(i, 1); save(); };
        li.appendChild(span);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      const v = document.getElementById('t').value.trim();
      if (!v) return;
      todos.push({ text: v, done: false });
      document.getElementById('t').value = '';
      save();
    };
    render();
  </script>
</body>
</html>
